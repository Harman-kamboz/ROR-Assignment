# PostgreSQL. Versions 9.5 and up are supported.
#
# Default local setup uses a user-space Postgres on port 5433 when the
# system cluster has no role for the current user. Override with env vars.

default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5433) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "invinsible") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>

development:
  <<: *default
  database: saas_marketplace_development

test:
  <<: *default
  database: saas_marketplace_test

production:
  primary: &primary_production
    <<: *default
    database: saas_marketplace_production
    username: saas_marketplace
    password: <%= ENV["SAAS_MARKETPLACE_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: saas_marketplace_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: saas_marketplace_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: saas_marketplace_production_cable
    migrations_paths: db/cable_migrate
